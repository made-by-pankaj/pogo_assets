name: Sync Upstream Assets

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    
    # We only need contents: write since we won't touch workflows anymore
    permissions:
      contents: write

    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Pull changes from upstream
        env:
          UPSTREAM_URL: ${{ secrets.UPSTREAM_REPO_URL }}
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream
          
          # Configure git identity for automated commits
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Merge changes from upstream main branch
          git merge upstream/main --allow-unrelated-histories -m "Automated sync with upstream assets"
          
          # Immediately delete any incoming workflow files from the working tree and index
          git rm -rf --ignore-unmatch .github/workflows/ || true
          rm -rf .github/workflows/ || true
          
          # Restore YOUR workflow file so it stays safe and untouched in your repo
          git checkout HEAD -- .github/workflows/sync.yml || true
          
          # Update the timestamp file with the exact current UTC run time
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last_updated_pokemon_images
          
          # Stage asset changes and timestamp (git status will ignore the restored workflow file because it's unmodified)
          git add -A
          
          # Commit updates
          git commit -m "Automated sync: update assets and workflow run timestamp" || echo "No changes to commit"
          
          # Push changes back to your repository
          git push origin main
